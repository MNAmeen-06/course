<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 320px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        .notice {
            font-size: 13px;
            color: #555;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;

            border: none;
            border-radius: 5px;

            background: #4285f4;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Demo</h2>

        <div class="notice">
            Test/demo form — do not enter a real password.
        </div>

        <form
            action="https://formspree.io/f/xoevaeza"
            method="POST"
        >

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Test password"
                required
            >

            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</body>
</html>
